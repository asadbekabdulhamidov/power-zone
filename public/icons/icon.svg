<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#limeGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Subtle glow circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#84CC16" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8"/>

  <!-- Stylized Dumbbell / Fitness Emblem -->
  <g filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="156" y="240" width="200" height="32" rx="16" fill="#F4F4F5"/>

    <!-- Center Grip Textured Lines -->
    <line x1="236" y1="240" x2="236" y2="272" stroke="#A1A1AA" stroke-width="4"/>
    <line x1="256" y1="240" x2="256" y2="272" stroke="#A1A1AA" stroke-width="4"/>
    <line x1="276" y1="240" x2="276" y2="272" stroke="#A1A1AA" stroke-width="4"/>

    <!-- Left Weight Collars -->
    <rect x="190" y="224" width="16" height="64" rx="8" fill="url(#limeGrad)"/>
    <rect x="144" y="196" width="36" height="120" rx="16" fill="url(#limeGrad)"/>
    <rect x="96" y="216" width="32" height="80" rx="12" fill="url(#limeGrad)"/>

    <!-- Right Weight Collars -->
    <rect x="306" y="224" width="16" height="64" rx="8" fill="url(#limeGrad)"/>
    <rect x="332" y="196" width="36" height="120" rx="16" fill="url(#limeGrad)"/>
    <rect x="384" y="216" width="32" height="80" rx="12" fill="url(#limeGrad)"/>
  </g>

  <!-- Brand Subtext -->
  <text x="256" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#FFFFFF">POWER <tspan fill="#A3E635">ZONE</tspan></text>
  <text x="256" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#A1A1AA">FITNES KLUB &amp; CRM</text>
</svg>
